services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    shm_size: 2gb
    networks:
      - postgres
    volumes:
      - pg_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

networks:
  postgres:
    driver: bridge

volumes:
  pg_data:
